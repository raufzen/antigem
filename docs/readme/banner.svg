<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="AntiGem by Rauf - Mobile AI coding workspace for Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0f1123"/>
      <stop offset="100%" stop-color="#140e2b"/>
    </linearGradient>
    <radialGradient id="glow-purple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#252445" stroke-width="0.8" opacity="0.5"/>
    </pattern>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow-purple)"/>
  <rect width="1280" height="420" fill="url(#glow-blue)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- Top bar -->
  <line x1="60" y1="50" x2="1220" y2="50" stroke="#222344" stroke-width="1.5"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#6d6d9e">GITHUB.COM / RAUFZEN / ANTIGEM</text>
  <text x="1220" y="38" text-anchor="end" font-family="monospace" font-size="13" font-weight="600" fill="#38bdf8">ANDROID AI IDE · v2.0.4-BETA</text>

  <!-- Center Card -->
  <g transform="translate(60, 90)">
    <!-- Gem Icon -->
    <g transform="translate(0, 15)">
      <rect width="90" height="90" rx="22" fill="#121329" stroke="#3c386e" stroke-width="2" filter="url(#glow)"/>
      <!-- Gem polygon -->
      <polygon points="45,22 68,36 60,68 30,68 22,36" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="45,22 60,68 30,68" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
      <circle cx="45" cy="45" r="4" fill="#f472b6"/>
    </g>

    <!-- Main Title -->
    <text x="120" y="65" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif" font-size="60" font-weight="900" letter-spacing="-1.5" fill="url(#title-grad)">AntiGem by Rauf</text>
    <text x="120" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="500" fill="#a5b4fc">A full mobile AI coding workspace &amp; Termux Linux IDE — in your pocket.</text>

    <!-- Tags Row -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#171836" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="82" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#c4b5fd">🤖 CLAUDE &amp; AGY CLI</text>

      <rect x="180" y="0" width="145" height="38" rx="8" fill="#171836" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="252" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#67e8f9">🐧 TERMUX SHELL</text>

      <rect x="340" y="0" width="155" height="38" rx="8" fill="#171836" stroke="#10b981" stroke-width="1.2"/>
      <text x="417" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#6ee7b7">🌐 BROWSER RUNNER</text>

      <rect x="510" y="0" width="150" height="38" rx="8" fill="#171836" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="585" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#fcd34d">📱 NATIVE ANDROID</text>

      <rect x="675" y="0" width="145" height="38" rx="8" fill="#171836" stroke="#ec4899" stroke-width="1.2"/>
      <text x="747" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#f472b6">⚡ STANDALONE APK</text>
    </g>

    <!-- Author Badge -->
    <g transform="translate(0, 220)">
      <line x1="0" y1="0" x2="1160" y2="0" stroke="#222344" stroke-width="1.5"/>
      <text x="0" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#6d6d9e">MAINTAINED &amp; RELEASED BY <tspan fill="#e0e7ff" font-weight="700">RAUF ZEN</tspan> (@raufzen)</text>
      <text x="1160" y="28" text-anchor="end" font-family="monospace" font-size="13" fill="#6d6d9e">GPLv3 LICENSE · OPEN SOURCE</text>
    </g>
  </g>
</svg>